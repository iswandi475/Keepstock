<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KEEPSTOCK Secure Biometric</title><meta name="theme-color" content="#ffe000"><style>body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center}.box{width:min(420px,90vw);background:#191c1d;border:1px solid #333;border-radius:24px;padding:28px;text-align:center;box-sizing:border-box}h1{margin:0 0 8px;color:#ffe000}.sub{color:#aaa;font-size:14px;line-height:1.5}.icon{font-size:54px;margin:20px}.status{margin-top:18px;padding:12px;border-radius:12px;background:#222;color:#ddd;font-size:13px}.btn{margin-top:18px;width:100%;padding:14px;border:0;border-radius:13px;background:#ffe000;font-weight:900;font-size:15px}</style></head><body><div class="box"><h1>KEEPSTOCK</h1><div class="sub">Secure Biometric</div><div class="icon">🔐</div><div id="status" class="status">Menyiapkan Fingerprint / Face Unlock...</div><button id="retry" class="btn" style="display:none" onclick="run()">COBA LAGI</button></div><script>
const P=new URLSearchParams(location.search);const mode=(P.get('mode')||'').toLowerCase();const handoff=P.get('handoff')||'';const challenge=P.get('challenge')||'';const userId=P.get('userId')||'';const nik=P.get('nik')||'';const deviceId=P.get('deviceId')||'';const returnUrl=P.get('returnUrl')||'';const loginMode=(P.get('loginMode')||'REFILL').toUpperCase();let credentialIds=[];try{credentialIds=JSON.parse(P.get('credentialIds')||'[]')}catch(e){}
function b64(s){return String(s||'').replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(String(s||'').length/4)*4,'=')}function bytes(s){const bin=atob(b64(s)),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}function enc(obj){const u=new TextEncoder().encode(JSON.stringify(obj));let s='';for(const x of u)s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}function bio64(buf){let s='';for(const x of new Uint8Array(buf))s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}function back(payload){const base=returnUrl;const sep=base.indexOf('?')>=0?'&':'?';location.href=base+sep+'ks_bio_bridge=1&handoff='+encodeURIComponent(handoff)+'&payload='+encodeURIComponent(enc(payload))}
async function run(){document.getElementById('retry').style.display='none';const st=document.getElementById('status');try{if(!window.isSecureContext)throw new Error('Halaman biometric harus HTTPS.');if(!window.PublicKeyCredential||!navigator.credentials)throw new Error('Browser tidak mendukung Passkey/WebAuthn.');if(!handoff||!challenge||!returnUrl)throw new Error('Parameter biometric tidak lengkap.');if(mode==='register'){const cred=await navigator.credentials.create({publicKey:{challenge:bytes(challenge),rp:{name:'KEEPSTOCK'},user:{id:bytes(userId),name:nik,displayName:nik},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',residentKey:'discouraged',userVerification:'required'},hints:['client-device'],timeout:60000,attestation:'none'}});if(!cred)throw new Error('Registrasi dibatalkan.');const r=cred.response;back({kind:'REGISTER',credential:{id:cred.id,type:cred.type,response:{clientDataJSON:bio64(r.clientDataJSON),attestationObject:bio64(r.attestationObject)},method:'Fingerprint / Face Unlock',userAgent:navigator.userAgent}})}else if(mode==='login'){const assertion=await navigator.credentials.get({publicKey:{challenge:bytes(challenge),allowCredentials:credentialIds.map(id=>({id:bytes(id),type:'public-key',transports:['internal']})),userVerification:'required',hints:['client-device'],timeout:60000}});if(!assertion)throw new Error('Autentikasi dibatalkan.');const r=assertion.response;back({kind:'LOGIN',mode:loginMode,assertion:{id:assertion.id,type:assertion.type,response:{clientDataJSON:bio64(r.clientDataJSON),authenticatorData:bio64(r.authenticatorData),signature:bio64(r.signature),userHandle:r.userHandle?bio64(r.userHandle):''}}})}else throw new Error('Mode biometric tidak dikenal.')}catch(e){st.textContent='❌ '+(e&&e.message||e);document.getElementById('retry').style.display='block'}}run();</script></body></html>
