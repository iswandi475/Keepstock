<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>KEEPSTOCK Biometric</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center}
    .card{width:min(92vw,420px);padding:28px 22px;border-radius:20px;background:#1d1d1d;box-shadow:0 12px 40px rgba(0,0,0,.35)}
    .icon{font-size:52px;margin-bottom:10px}.title{font-size:21px;font-weight:700}.msg{margin-top:10px;line-height:1.5;color:#ccc;font-size:14px}.error{color:#ff8a8a}.ok{color:#8ff0a4}
  </style>
</head>
<body>
<div class="card">
  <div class="icon">🔐</div>
  <div class="title">KEEPSTOCK Biometric</div>
  <div id="msg" class="msg">Menyiapkan Face ID / Fingerprint…</div>
</div>
<script>
(function(){
  'use strict';
  var p=new URLSearchParams(location.search||'');
  var mode=String(p.get('mode')||'login').toLowerCase();
  var handoff=String(p.get('handoff')||'');
  var challenge=String(p.get('challenge')||'');
  var returnUrl=String(p.get('returnUrl')||'https://iswandi475.github.io/Keepstock/');
  var credentialIds=[];
  var loginMode=String(p.get('loginMode')||'REFILL').toUpperCase();
  var auto=p.get('auto')==='1';
  var discoverable=p.get('discoverable')==='1';
  var msg=document.getElementById('msg');

  try{credentialIds=JSON.parse(p.get('credentialIds')||'[]');if(!Array.isArray(credentialIds))credentialIds=[];}catch(e){credentialIds=[];}

  function text(s,cls){msg.className='msg'+(cls?' '+cls:'');msg.textContent=s;}
  function b64(buf){
    var a=new Uint8Array(buf),s='';
    for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);
    return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function bytes(s){
    s=String(s||'').replace(/-/g,'+').replace(/_/g,'/');
    while(s.length%4)s+='=';
    var bin=atob(s),a=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
    return a;
  }
  function enc(obj){return b64(new TextEncoder().encode(JSON.stringify(obj)));}
  function send(payload){
    var packed=enc(payload);
    var delivered=false;
    try{
      if(window.opener&&!window.opener.closed){
        window.opener.postMessage({type:'KS_BIO_BRIDGE_RESULT',handoff:handoff,payload:packed},'*');
        delivered=true;
      }
    }catch(e){}
    // V65: jangan redirect ke launcher PWA setelah REGISTER/LOGIN.
    // Redirect sebelumnya membuat popup terlihat seperti kembali ke menu awal
    // dan, pada beberapa Android browser, memutus relay hasil biometric.
    if(delivered){
      text(payload.kind==='ERROR'?(payload.message||'Biometric gagal.'):'Biometric selesai. Menutup halaman…',payload.kind==='ERROR'?'error':'ok');
      setTimeout(function(){try{window.close()}catch(e){}},350);
      return;
    }
    // Fallback hanya jika halaman bridge dibuka tanpa opener.
    try{
      var u=new URL(returnUrl);
      u.searchParams.set('ks_bio_bridge','1');
      u.searchParams.set('handoff',handoff);
      u.searchParams.set('payload',packed);
      location.replace(u.toString());
      return;
    }catch(e){}
    text(payload.message||'Selesai.',payload.kind==='ERROR'?'error':'ok');
  }
  function fail(message){
    send({kind:'ERROR',mode:loginMode,message:String(message||'Biometric tidak dapat digunakan.')});
  }
  function friendlyError(e,register){
    var n=String(e&&e.name||'');
    if(n==='NotAllowedError')return register?'Registrasi biometric dibatalkan atau tidak diizinkan. Coba lagi dan selesaikan Face ID / Fingerprint.':'Biometric dibatalkan atau tidak tersedia. Coba lagi.';
    if(n==='SecurityError')return 'WebAuthn diblokir oleh keamanan browser. Buka KeepStock dari HTTPS dan jangan gunakan mode private/incognito.';
    if(n==='InvalidStateError')return 'Credential biometric sudah ada atau state perangkat tidak cocok. Gunakan DAFTARKAN ULANG BIOMETRIC.';
    if(n==='NotSupportedError')return 'Perangkat/browser ini tidak mendukung passkey biometric.';
    if(n==='UnknownError')return 'Credential biometric di perangkat tidak dapat diakses. Jika data browser baru saja dihapus, gunakan login biasa lalu DAFTARKAN ULANG BIOMETRIC.';
    return String(e&&e.message||'Biometric gagal. Gunakan login biasa lalu DAFTARKAN ULANG BIOMETRIC.');
  }

  async function register(){
    if(!window.PublicKeyCredential||!navigator.credentials)return fail('Perangkat/browser ini belum mendukung Passkey/WebAuthn.');
    if(!challenge||!handoff)return fail('Sesi registrasi biometric tidak lengkap. Ulangi proses.');
    var nik=String(p.get('nik')||'');
    var userId=String(p.get('userId')||'');
    if(!userId)return fail('Identitas registrasi biometric tidak ditemukan.');
    text('Konfirmasi Face ID / Fingerprint pada perangkat…');
    try{
      var cred=await navigator.credentials.create({publicKey:{
        challenge:bytes(challenge),
        rp:{name:'KEEPSTOCK',id:location.hostname},
        user:{id:bytes(userId),name:nik||'KEEPSTOCK',displayName:nik||'KEEPSTOCK'},
        pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
        authenticatorSelection:{authenticatorAttachment:'platform',residentKey:'required',requireResidentKey:true,userVerification:'required'},
        timeout:60000,
        attestation:'none'
      }});
      if(!cred)throw new Error('Registrasi biometric dibatalkan.');
      var r=cred.response;
      send({kind:'REGISTER',mode:'REGISTER',credential:{id:cred.id,type:cred.type,response:{clientDataJSON:b64(r.clientDataJSON),attestationObject:b64(r.attestationObject)},method:'Face ID / Fingerprint',userAgent:navigator.userAgent}});
    }catch(e){fail(friendlyError(e,true));}
  }

  async function login(){
    if(!window.PublicKeyCredential||!navigator.credentials)return fail('Perangkat/browser ini belum mendukung Passkey/WebAuthn.');
    if(!challenge||!handoff)return fail('Sesi biometric tidak lengkap. Ulangi proses.');
    text('Menunggu Face ID / Fingerprint…');
    try{
      var publicKey={
        challenge:bytes(challenge),
        rpId:location.hostname,
        userVerification:'required',
        timeout:60000
      };
      // V64: bila credentialIds kosong, JANGAN mengirim allowCredentials.
      // Ini membuat Credential Manager mencari discoverable passkey yang masih
      // tersedia di perangkat, sehingga tidak terikat pada credential ID lama.
      if(credentialIds.length){
        publicKey.allowCredentials=credentialIds.map(function(id){return {type:'public-key',id:bytes(id),transports:['internal']};});
      }
      var assertion=await navigator.credentials.get({publicKey:publicKey});
      if(!assertion)throw new Error('Login biometric dibatalkan.');
      var r=assertion.response;
      send({kind:auto?'LOGIN_AUTO':'LOGIN',mode:loginMode,assertion:{id:assertion.id,type:assertion.type,response:{clientDataJSON:b64(r.clientDataJSON),authenticatorData:b64(r.authenticatorData),signature:b64(r.signature),userHandle:r.userHandle?b64(r.userHandle):null}}});
    }catch(e){fail(friendlyError(e,false));}
  }

  if(location.protocol!=='https:')return fail('Biometric membutuhkan koneksi HTTPS.');
  if(mode==='register')register();else login();
})();
</script>
</body>
</html>
