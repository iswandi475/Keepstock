<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffe000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KEEPSTOCK">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>KEEPSTOCK REFILL</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe src="https://script.google.com/macros/s/AKfycbwWjgy0gBgx8SMvXwlWe_aIbDw_WG4PAFmv_Le9WV3MnV6uyktmRD5W3iz97zcQxdhETg/exec" allow="camera; microphone"></iframe>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
<script>
(function(){
  const qs = window.location.search;
  const f = document.querySelector('iframe');
  if (!f || !qs) return;

  // 1) Tetap teruskan query ke iframe sebagai jalur utama.
  const base = f.getAttribute('src') || '';
  const sep = base.includes('?') ? '&' : '?';
  f.src = base + sep + qs.slice(1);

  // 2) Kirim juga hasil biometric lewat postMessage setelah iframe siap.
  //    Ini menjadi jalur cadangan sehingga auto-login tidak bergantung
  //    pada query parameter Apps Script.
  const p = new URLSearchParams(qs);
  const handoff = p.get('handoff') || '';
  const payload = p.get('payload') || '';

  if (p.get('ks_bio_bridge') === '1' && handoff && payload) {
    const send = function(){
      try {
        f.contentWindow.postMessage({
          type: 'KS_BIO_BRIDGE_RESULT',
          handoff: handoff,
          payload: payload
        }, '*');
      } catch(e) {}
    };

    f.addEventListener('load', function(){
      setTimeout(send, 150);
    }, {once:false});

    setTimeout(send, 700);
    setTimeout(send, 1600);
  }
})();
</script>
</body>
</html>
