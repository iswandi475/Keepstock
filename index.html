<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffe000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KEEPSTOCK">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>KEEPSTOCK REFILL</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe src="https://script.google.com/macros/s/AKfycbwWjgy0gBgx8SMvXwlWe_aIbDw_WG4PAFmv_Le9WV3MnV6uyktmRD5W3iz97zcQxdhETg/exec" allow="camera; microphone"></iframe>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
<script>
(function(){
  const KEY='KS_BIO_BRIDGE_RESULT_V54';
  const f=document.querySelector('iframe');
  if(!f)return;

  function getRelay(){
    try{
      const raw=localStorage.getItem(KEY);
      if(raw){
        const x=JSON.parse(raw);
        if(x&&x.handoff&&x.payload)return x;
      }
    }catch(e){}
    const p=new URLSearchParams(window.location.search||'');
    if(p.get('ks_bio_bridge')==='1'&&p.get('handoff')&&p.get('payload')){
      return {handoff:p.get('handoff'),payload:p.get('payload')};
    }
    return null;
  }

  const relay=getRelay();
  if(!relay)return;

  const base=f.getAttribute('src')||'';
  const sep=base.includes('?')?'&':'?';
  // Query tetap menjadi jalur pertama agar doGet Apps Script dapat langsung
  // menyuntikkan hasil bridge ke HTML iframe.
  f.src=base+sep+'ks_bio_bridge=1&handoff='+encodeURIComponent(relay.handoff)+'&payload='+encodeURIComponent(relay.payload);

  function send(){
    try{
      f.contentWindow.postMessage({
        type:'KS_BIO_BRIDGE_RESULT',
        handoff:relay.handoff,
        payload:relay.payload
      },'*');
    }catch(e){}
  }

  f.addEventListener('load',function(){
    setTimeout(send,100);
    setTimeout(send,500);
    setTimeout(send,1500);
  });

  setTimeout(send,1000);
  setTimeout(send,2500);

  // Jangan langsung menghapus relay. Biarkan tersedia beberapa detik jika
  // iframe Apps Script terlambat selesai memuat.
  setTimeout(function(){
    try{localStorage.removeItem(KEY);}catch(e){}
  },15000);
})();
</script>
</body>
</html>
