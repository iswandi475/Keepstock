<!doctype html>
<!-- KEEPSTOCK BIOMETRIC V65 - DIRECT OPENER FIX -->
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KEEPSTOCK • Biometric</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111;color:#fff;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{width:min(420px,calc(100% - 32px));box-sizing:border-box;background:#1b1b1b;border-radius:24px;padding:28px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .icon{font-size:48px;margin-bottom:10px}
  h1{font-size:22px;margin:0 0 10px}
  p{color:#bbb;line-height:1.5;margin:8px 0}
  #status{min-height:48px;margin:16px 0}
  button{border:0;border-radius:14px;padding:14px 20px;font-size:16px;font-weight:700;background:#fff;color:#111;width:100%;cursor:pointer}
  button:disabled{opacity:.55}
  .small{font-size:12px;color:#777;margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔐</div>
  <h1>KEEPSTOCK Biometric</h1>
  <p id="status">Menyiapkan Face ID / Fingerprint…</p>
  <button id="bioBtn" type="button" hidden>Gunakan Face ID / Fingerprint</button>
  <div class="small">Biometric perangkat tidak dikirim atau disimpan oleh KEEPSTOCK.</div>
</div>

<script>
(function(){
  'use strict';

  const q = new URLSearchParams(location.search);
  const mode = String(q.get('mode') || 'login').toLowerCase();
  const handoff = String(q.get('handoff') || '');
  const challenge = String(q.get('challenge') || '');
  const credentialIds = parseJson(q.get('credentialIds') || '[]', []);
  const userId = String(q.get('userId') || '');
  const rpName = String(q.get('rpName') || 'KEEPSTOCK');
  const returnUrl = String(q.get('returnUrl') || 'https://iswandi475.github.io/Keepstock/');
  const loginMode = String(q.get('loginMode') || 'REFILL').toUpperCase();
  const auto = q.get('auto') === '1';

  const statusEl = document.getElementById('status');
  const btn = document.getElementById('bioBtn');

  function parseJson(s, fallback){
    try { return JSON.parse(s); } catch(e) { return fallback; }
  }

  function b64uBytes(s){
    s = String(s || '').replace(/-/g,'+').replace(/_/g,'/');
    while(s.length % 4) s += '=';
    const bin = atob(s);
    const out = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function bytesB64u(buf){
    const bytes = new Uint8Array(buf);
    let bin = '';
    for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }

  function jsonB64u(obj){
    return bytesB64u(new TextEncoder().encode(JSON.stringify(obj)));
  }

  function isIOS(){
    return /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
           (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }

  function methodLabel(){
    return isIOS() ? 'Face ID / Platform Biometric' : 'Platform Biometric / Fingerprint';
  }

  function show(msg){
    statusEl.textContent = msg;
  }

  function sendResult(payload){
    const packed = jsonB64u(payload);

    // V65 FIX:
    // Jika popup masih memiliki opener, kirim hasil langsung ke window KEEPSTOCK
    // lalu JANGAN melakukan location.replace(). Navigasi popup ke GitHub pada saat
    // yang sama dapat mereload launcher/iframe dan memutus callback google.script.run.
    let delivered = false;
    try{
      if(window.opener && !window.opener.closed){
        window.opener.postMessage({
          type:'KS_BIO_BRIDGE_RESULT',
          handoff:handoff,
          payload:packed
        }, '*');
        delivered = true;
      }
    }catch(e){}

    if(delivered){
      try{
        show(isIOS() ? '✅ Face ID berhasil. Kembali ke KEEPSTOCK…' : '✅ Fingerprint berhasil. Kembali ke KEEPSTOCK…');
      }catch(e){}
      // Biarkan opener menyelesaikan finishBiometricLoginBridgeAuto() dan
      // masukApp() terlebih dahulu. Popup kemudian ditutup tanpa navigasi.
      setTimeout(function(){
        try{window.close();}catch(e){}
      }, 500);
      return;
    }

    // Fallback hanya jika popup benar-benar tidak mempunyai opener.
    try{
      const u = new URL(returnUrl);
      u.searchParams.set('ks_bio_bridge','1');
      u.searchParams.set('handoff',handoff);
      u.searchParams.set('payload',packed);
      u.searchParams.set('mode',mode);
      location.replace(u.toString());
    }catch(e){
      show('Hasil biometric sudah dikirim. Silakan kembali ke KEEPSTOCK.');
    }
  }

  function fail(err){
    const name = err && err.name ? String(err.name) : '';
    const msg = err && err.message ? String(err.message) : String(err || '');
    console.error('KEEPSTOCK biometric:', name, msg);

    if(name === 'NotAllowedError'){
      show('Face ID / Fingerprint belum dijalankan. Tekan tombol di bawah.');
      btn.hidden = false;
      btn.disabled = false;
      return;
    }

    show('Biometric gagal: ' + (msg || name || 'coba lagi.'));
    btn.hidden = false;
    btn.disabled = false;
  }

  async function register(){
    if(!window.PublicKeyCredential || !navigator.credentials){
      show('Browser ini belum mendukung Passkey / WebAuthn.');
      return;
    }
    if(!challenge || !userId || !handoff){
      show('Parameter registrasi biometric tidak lengkap.');
      return;
    }

    show(isIOS() ? 'Menunggu Face ID…' : 'Menunggu biometric perangkat…');
    btn.hidden = true;

    try{
      const cred = await navigator.credentials.create({
        publicKey:{
          challenge:b64uBytes(challenge),
          rp:{name:rpName,id:location.hostname},
          user:{
            id:b64uBytes(userId),
            name:String(q.get('nik') || 'KEEPSTOCK'),
            displayName:String(q.get('nik') || 'KEEPSTOCK')
          },
          pubKeyCredParams:[
            {type:'public-key',alg:-7},
            {type:'public-key',alg:-257}
          ],
          authenticatorSelection:{
            authenticatorAttachment:'platform',
            residentKey:'preferred',
            userVerification:'required'
          },
          timeout:60000,
          attestation:'none'
        }
      });

      if(!cred) throw new Error('Registrasi biometric dibatalkan.');

      sendResult({
        kind:'REGISTER',
        mode:'REGISTER',
        credential:{
          id:cred.id,
          type:cred.type,
          response:{
            clientDataJSON:bytesB64u(cred.response.clientDataJSON),
            attestationObject:bytesB64u(cred.response.attestationObject)
          },
          method:methodLabel(),
          userAgent:navigator.userAgent
        }
      });
    }catch(e){
      fail(e);
    }
  }

  async function login(){
    if(!window.PublicKeyCredential || !navigator.credentials){
      show('Browser ini belum mendukung Passkey / WebAuthn.');
      return;
    }
    if(!challenge || !handoff){
      show('Parameter login biometric tidak lengkap.');
      return;
    }

    show(isIOS() ? 'Menunggu Face ID…' : 'Menunggu biometric perangkat…');
    btn.hidden = true;

    try{
      const ids = Array.isArray(credentialIds) ? credentialIds : [];
      const allowCredentials = ids.map(function(id){
        return {type:'public-key',id:b64uBytes(id)};
      });

      const cred = await navigator.credentials.get({
        publicKey:{
          challenge:b64uBytes(challenge),
          allowCredentials:allowCredentials,
          userVerification:'required',
          timeout:60000
        }
      });

      if(!cred) throw new Error('Login biometric dibatalkan.');

      const r = cred.response;
      sendResult({
        kind:auto ? 'LOGIN_AUTO' : 'LOGIN',
        mode:loginMode,
        assertion:{
          id:cred.id,
          type:cred.type,
          response:{
            clientDataJSON:bytesB64u(r.clientDataJSON),
            authenticatorData:bytesB64u(r.authenticatorData),
            signature:bytesB64u(r.signature),
            userHandle:r.userHandle ? bytesB64u(r.userHandle) : ''
          }
        }
      });
    }catch(e){
      fail(e);
    }
  }

  async function start(){
    btn.textContent = isIOS() ? 'Gunakan Face ID' : 'Gunakan Fingerprint / Biometric';
    btn.onclick = function(){
      if(mode === 'register') register();
      else login();
    };

    if(mode === 'register') await register();
    else await login();
  }

  start();
})();
</script>
</body>
</html>
